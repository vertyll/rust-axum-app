name: Architecture

on:
  push:
    branches: [main]
    paths:
      - "architecture/**"
      - "backend/src/**"
      - "frontend/src/**"
      - ".github/workflows/architecture.yml"
  pull_request:
    branches: [main]
    paths:
      - "architecture/**"
      - "backend/src/**"
      - "frontend/src/**"
      - ".github/workflows/architecture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: architecture
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: architecture

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The rules of the back-end and the front-end are its tests, read from their source.
      - name: Test
        run: cargo test --locked
