name: Frontend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "frontend/**"
      - "backend/translations/**"
      - "backend/src/*/messages/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/translations/**"
      - "backend/src/*/messages/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TOPCOAT_CLI_VERSION: 0.10.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend

      - name: Install the Topcoat CLI
        run: cargo install topcoat-cli --version "$TOPCOAT_CLI_VERSION" --locked --root .tools

      - name: Check formatting
        run: .tools/bin/topcoat fmt --rustfmt --check src tests build.rs

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Analyze
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend

      - name: Test
        run: cargo test --locked

  image:
    name: Image
    needs: [lint, test]
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=rust-axum-app-frontend
          cache-to: type=gha,mode=max,scope=rust-axum-app-frontend
