[package]
name = "rust-axum-app"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
authors = ["Mikołaj Gawron <gawrmiko@gmail.com>"]
description = "Rust Axum App — modular monolith (hexagonal architecture) on Toasty ORM"
default-run = "rust-axum-app"

[lib]
name = "rust_axum_app"
path = "src/lib.rs"

[[bin]]
name = "rust-axum-app"
path = "src/main.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23"
dotenvy = "0.15.7"
fred = "10"
jiff = { version = "0.2", features = ["serde"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
swc_icu_messageformat_parser = "38"
thiserror = "2.0"
toasty = { version = "0.11", features = ["postgresql", "jiff", "serde"] }
toasty-cli = "0.11"
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"time",
	"fs",
	"net",
	"io-util",
	"signal",
] }
tower-sessions = "0.14"
tower-sessions-redis-store = "0.16"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
validator = { version = "0.21", features = ["derive"] }
