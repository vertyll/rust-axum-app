[package]
name = "rust-axum-app-frontend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Mikołaj Gawron <gawrmiko@gmail.com>"]
description = "Rust Axum App front-end – server-rendered front-end on Topcoat"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
self_named_module_files = "warn"

[dependencies]
dotenvy = "0.15.7"
form_urlencoded = "1"
formatjs_icu_messageformat = "0.3"
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
topcoat = { version = "0.10", features = ["multipart", "tailwind", "ui"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
topcoat = { version = "0.10", default-features = false, features = ["tailwind"] }
