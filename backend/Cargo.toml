[package]
name = "rust-axum-app-backend"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
authors = ["Mikołaj Gawron <gawrmiko@gmail.com>"]
description = "Rust Axum App back-end – modular monolith (hexagonal architecture) on Toasty ORM"
default-run = "rust-axum-app-backend"

[lib]
name = "rust_axum_app_backend"
path = "src/lib.rs"

[[bin]]
name = "rust-axum-app-backend"
path = "src/main.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A port's trait is async; an in-memory fake or an extractor with nothing to await still has to keep its signature.
unused_async_trait_impl = "allow"
# An application, not a library: a public function is a module's boundary, and its error type says what can fail.
missing_errors_doc = "allow"
# Every module is a directory with its own `mod.rs`; a module written as `foo.rs` next to `foo/` would mix the styles.
self_named_module_files = "warn"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-sdk-s3 = { version = "1.152", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23"
bytes = "1"
dotenvy = "0.15.7"
fred = "10"
futures-util = "0.3"
hmac = "0.13"
jiff = { version = "0.2", features = ["serde"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
rand = "0.10"
rmp-serde = "1.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
swc_icu_messageformat_parser = "38"
thiserror = "2.0"
toasty = { version = "0.11", features = ["postgresql", "jiff", "serde"] }
toasty-cli = "0.11"
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"time",
	"fs",
	"net",
	"io-util",
	"signal",
] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-sessions = "0.14"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }
validator = { version = "0.21", features = ["derive"] }
secrecy = "0.10"

[dev-dependencies]
serde_urlencoded = "0.7"
tempfile = "3"
testcontainers-modules = { version = "0.15.0", features = ["redis"] }
