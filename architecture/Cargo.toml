[package]
name = "rust-axum-app-architecture"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Mikołaj Gawron <gawrmiko@gmail.com>"]
description = "Architecture tests for the Rust Axum App crates: the rules their modules keep, checked on their source"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every module is a directory with its own `mod.rs`; a module written as `foo.rs` next to `foo/` would mix the styles.
self_named_module_files = "warn"

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "2.0.119", features = ["full", "visit"] }
thiserror = "2.0"
